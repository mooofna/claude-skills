  - id: LinAlg-L03-009
    type: basic
    front: |
      What does centering the data matrix \(X\) (subtracting column means) change about the meaning of its SVD?
    back: |
      After centering, the right singular vectors are the **principal components**: \(X^\top X / (n-1)\) is the covariance matrix, so the SVD of centered \(X\) is PCA.
    figure_back: {slide: 6, candidate: f1}
    source: [6]
    tags: [type::mechanism, topic::pca]

  - id: LinAlg-L03-010
    type: basic
    front: |
      \(A\) has singular values 5, 3 and 1. What are the spectral-norm and the Frobenius-norm error of its best rank-1 approximation?
    back: |
      Spectral norm: \(\sigma_2 = 3\). Frobenius norm: \(\sqrt{\sigma_2^2 + \sigma_3^2} = \sqrt{9 + 1} = \sqrt{10}\).
    extra: |
      The exam's distractor gives 3 for both; only the spectral error is a single singular value.
    source: [7]
    source_ref: "Exam 2024 Q2"
